<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" role="img" aria-labelledby="title desc">
  <title id="title">OfflineScribeAI evaluation dashboard</title>
  <desc id="desc">Mock dashboard showing evaluation runs, grounding, unsupported claims, latency, memory, and human edit rate.</desc>
  <rect width="560" height="460" rx="18" fill="#ffffff"/>
  <rect x="20" y="20" width="520" height="420" rx="14" fill="#fbfbf7" stroke="#d7ded9"/>
  <text x="44" y="62" fill="#126b62" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">RESEARCH DASHBOARD</text>
  <text x="44" y="91" fill="#172322" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Pilot evaluation run</text>
  <text x="44" y="118" fill="#5d6968" font-family="Inter, Arial, sans-serif" font-size="13">Synthetic data, deterministic runner, no clinical claims.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="44" y="150" width="142" height="96" rx="8" fill="#edf5f1" stroke="#9ecdc2"/>
    <text x="62" y="181" fill="#5d6968" font-size="12" font-weight="800">CASES</text>
    <text x="62" y="218" fill="#172322" font-size="34" font-weight="800">100</text>

    <rect x="210" y="150" width="142" height="96" rx="8" fill="#eef2f7" stroke="#b7c5df"/>
    <text x="228" y="181" fill="#5d6968" font-size="12" font-weight="800">CONDITIONS</text>
    <text x="228" y="218" fill="#172322" font-size="34" font-weight="800">4</text>

    <rect x="376" y="150" width="120" height="96" rx="8" fill="#fff7f4" stroke="#dda1a7"/>
    <text x="394" y="181" fill="#5d6968" font-size="12" font-weight="800">STATUS</text>
    <text x="394" y="215" fill="#b94b55" font-size="18" font-weight="800">Research</text>
    <text x="394" y="236" fill="#b94b55" font-size="18" font-weight="800">only</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="48" y="285" fill="#172322" font-weight="800">Metric</text>
    <text x="258" y="285" fill="#172322" font-weight="800">What it reveals</text>
    <line x1="44" y1="300" x2="500" y2="300" stroke="#d7ded9"/>

    <text x="48" y="326" fill="#126b62" font-weight="800">Grounding</text>
    <text x="258" y="326" fill="#5d6968">Supported vs unsupported statements</text>
    <line x1="44" y1="342" x2="500" y2="342" stroke="#d7ded9"/>

    <text x="48" y="368" fill="#126b62" font-weight="800">Negation</text>
    <text x="258" y="368" fill="#5d6968">Denied, historical, uncertain, present</text>
    <line x1="44" y1="384" x2="500" y2="384" stroke="#d7ded9"/>

    <text x="48" y="410" fill="#126b62" font-weight="800">Resources</text>
    <text x="258" y="410" fill="#5d6968">Latency, RAM, CPU, model size</text>
  </g>
</svg>

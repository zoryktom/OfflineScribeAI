[project]
name = "offlinescribe"
version = "0.2.0"
description = "Local-first evaluation harness for clinical documentation LLMs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zorykto Mykola" }]
dependencies = [
  "pydantic>=2.9.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]
stats = ["scipy>=1.13.0"]

[project.scripts]
offlinescribe = "offlinescribe.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "eval: planted-error / ablation harness",
]
